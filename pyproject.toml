[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prezero-route"
version = "0.1.0"
description = "Dynamic route planning for glass recycling containers in Heilbronn"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "click>=8.1",
    "matplotlib>=3.7",
    "folium>=0.14",
    "plotly>=5.0",
    "scikit-learn>=1.3",
    "ortools>=9.10",
]

[project.scripts]
prezero = "prezero.cli:cli"
prezero-route = "prezero.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/prezero"]
